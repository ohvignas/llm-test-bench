services:
  bench:
    build: .
    image: llm-test-bench-local:latest
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      PUBLIC_ORIGIN: http://127.0.0.1:8085
      DATA_DIR: /data
      SECRETS_DIR: /secrets
    volumes:
      - bench-data:/data
      - bench-secrets:/secrets
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  bench-data:
  bench-secrets:
